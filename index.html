<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trevisan Impressoras</title>
    
    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel (Para o navegador entender o React/JSX diretamente) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos extras para esconder a barra de rolagem -->
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- Proteção contra Ecrã Branco -->
    <script>
        window.addEventListener('error', function(event) {
            const root = document.getElementById('root');
            if(root && root.innerHTML.includes('A carregar')) {
                root.innerHTML = '<div style="padding: 20px; color: #ef4444; background-color: #fef2f2; min-height: 100vh; font-family: sans-serif;"><b>Erro no carregamento:</b><br><br>' + event.error + '<br><br>Verifique a consola do navegador (F12) para mais detalhes.</div>';
            }
        });
    </script>
</head>
<body class="bg-zinc-950 antialiased text-zinc-900">
    <div id="root">
        <!-- Indicador de carregamento enquanto a página processa o código -->
        <div class="min-h-screen flex items-center justify-center bg-zinc-950">
            <div class="animate-pulse text-zinc-400 font-semibold tracking-widest text-sm uppercase">A carregar a aplicação...</div>
        </div>
    </div>

    <!-- Script Principal React da Aplicação -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Printer, Laptop, Receipt, Settings, Users, LogOut, 
          Search, Download, Trash2, Plus, CheckCircle2, X, Edit2,
          Smartphone, ChevronRight, Building2, User, Mail, Phone, MessageSquare, Image as ImageIcon, Palette, ShieldCheck, ArrowLeft, Check, Archive
        } from 'https://esm.sh/lucide-react@0.292.0';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { 
          getFirestore, collection, addDoc, onSnapshot, 
          doc, updateDoc, deleteDoc, setDoc 
        } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        // --- INICIALIZAÇÃO FIREBASE ---
        const meuFirebaseConfig = {
          apiKey: "AIzaSyDA2jcKD1cLvpnqobRSyYh0stvrBjcMMcs",
          authDomain: "trevisan-54c36.firebaseapp.com",
          projectId: "trevisan-54c36",
          storageBucket: "trevisan-54c36.firebasestorage.app",
          messagingSenderId: "437924059360",
          appId: "1:437924059360:web:015502270ea5c890ee5885",
          measurementId: "G-5QBZPRXFC1"
        };

        let configToUse = meuFirebaseConfig;
        try {
          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            configToUse = JSON.parse(__firebase_config);
          }
        } catch (e) {}

        const app = initializeApp(configToUse);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'simmobile-app';

        // --- DEFINIÇÕES POR DEFEITO ---
        const DEFAULT_SETTINGS = {
          whatsappNumber: '5511999999999',
          heroTitle: 'Equipamentos de alta performance',
          heroSubtitle: 'Locação à medida para o seu negócio. Escolha o equipamento e receba uma proposta rápida.',
          heroButtonText: 'Iniciar Cotação',
          heroImageUrl: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80',
          logoUrl: '', 
          primaryColor: '#6200ea',
          headerBgColor: '#ffffff',
          headerTextColor: '#18181b'
        };

        const DEFAULT_PRODUCTS = [
          { id: '1', name: 'Notebooks Corporativos', desc: 'Alta performance para equipas de escritório e terreno.', imageUrl: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' },
          { id: '2', name: 'Impressoras e Multifuncionais', desc: 'Reduza custos com outsourcing de impressão.', imageUrl: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' },
          { id: '3', name: 'Smartphones Corporativos', desc: 'Comunicação e mobilidade para a sua equipa de vendas.', imageUrl: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' }
        ];

        function App() {
          const [user, setUser] = useState(null);
          const [view, setView] = useState('app-funnel');
          const [isAdmin, setIsAdmin] = useState(false);
          const [loading, setLoading] = useState(true);

          const [settings, setSettings] = useState(DEFAULT_SETTINGS);
          const [products, setProducts] = useState([]);
          const [leads, setLeads] = useState([]);

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) { console.error("Erro na autenticação:", error); }
            };
            initAuth();
            const unsubscribeAuth = onAuthStateChanged(auth, setUser);
            return () => unsubscribeAuth();
          }, []);

          useEffect(() => {
            if (!user) return;
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'general');
            const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
            const leadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'leads');

            const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
              if (docSnap.exists()) setSettings({ ...DEFAULT_SETTINGS, ...docSnap.data() });
              else setDoc(settingsRef, DEFAULT_SETTINGS).catch(console.error);
              setLoading(false);
            }, (error) => console.error("Erro definições:", error));

            const unsubProducts = onSnapshot(productsRef, (snapshot) => {
              if (snapshot.empty && products.length === 0) {
                DEFAULT_PRODUCTS.forEach(p => {
                  const { id, ...prodData } = p; // Remove o ID fixo antes de adicionar ao Firebase
                  addDoc(productsRef, prodData).catch(console.error);
                });
              } else {
                const prods = [];
                // Assegura que o ID gerado pelo Firebase é o único associado ao produto
                snapshot.forEach(doc => prods.push({ ...doc.data(), id: doc.id }));
                setProducts(prods);
              }
            }, (error) => console.error("Erro produtos:", error));

            const unsubLeads = onSnapshot(leadsRef, (snapshot) => {
              const lds = [];
              snapshot.forEach(doc => lds.push({ ...doc.data(), id: doc.id }));
              setLeads(lds.sort((a, b) => b.createdAt - a.createdAt));
            }, (error) => console.error("Erro leads:", error));

            return () => { unsubSettings(); unsubProducts(); unsubLeads(); };
          }, [user]);

          const saveLead = async (leadData) => {
            if (!user) return false;
            try {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'leads'), { ...leadData, status: 'Novo', createdAt: Date.now() });
              return true;
            } catch (error) { return false; }
          };

          if (loading) {
            return <div className="min-h-screen flex items-center justify-center bg-zinc-950"><div className="animate-spin rounded-full h-12 w-12 border-[4px] border-zinc-800" style={{borderTopColor: settings.primaryColor}}></div></div>;
          }

          return (
            <div className="font-sans text-zinc-900 bg-zinc-950 min-h-screen antialiased">
              {view === 'app-funnel' && <AppFunnel settings={settings} products={products} saveLead={saveLead} onAdminClick={() => setView('admin-login')} />}
              {view === 'admin-login' && <AdminLogin settings={settings} onLogin={() => { setIsAdmin(true); setView('admin'); }} onBack={() => setView('app-funnel')} />}
              {view === 'admin' && isAdmin && <AdminDashboard leads={leads} settings={settings} products={products} onLogout={() => { setIsAdmin(false); setView('app-funnel'); }} />}
            </div>
          );
        }

        function AppFunnel({ settings, products, saveLead, onAdminClick }) {
          const [step, setStep] = useState(0);
          const [formData, setFormData] = useState({ nome: '', whatsapp: '', empresa: '', cnpj: '', email: '', produto: '', descricao: '' });
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [errorMsg, setErrorMsg] = useState('');

          const primaryStyle = { backgroundColor: settings.primaryColor, color: '#ffffff' };
          const primaryTextStyle = { color: settings.primaryColor };

          const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
            setErrorMsg('');
          };

          const handleProductSelect = (productName) => {
            setFormData(prev => ({ ...prev, produto: productName }));
            setTimeout(() => setStep(2), 350); 
          };

          const validateAndNext = () => {
            if (step === 2 && !formData.cnpj.trim()) return setErrorMsg('É obrigatório informar CNPJ ou Empresa.');
            if (step === 3 && (!formData.nome.trim() || !formData.whatsapp.trim())) return setErrorMsg('Nome e WhatsApp são obrigatórios.');
            setErrorMsg('');
            setStep(s => s + 1);
          };

          const handleSubmit = async () => {
            setIsSubmitting(true);
            const success = await saveLead(formData);
            if (success) {
              setStep(5);
              setTimeout(() => {
                const msg = `Olá, tenho interesse em locação de equipamentos.%0A%0A*Nome:* ${formData.nome}%0A*WhatsApp:* ${formData.whatsapp}%0A*Empresa/CNPJ:* ${formData.cnpj}%0A*E-mail:* ${formData.email}%0A*Interesse:* ${formData.produto}%0A*Detalhes:* ${formData.descricao}`;
                window.open(`https://wa.me/${settings.whatsappNumber.replace(/\D/g, '')}?text=${msg}`, '_blank');
                setTimeout(() => { setFormData({ nome: '', whatsapp: '', empresa: '', cnpj: '', email: '', produto: '', descricao: '' }); setStep(0); }, 3000);
              }, 1500);
            }
            setIsSubmitting(false);
          };

          const renderStepContent = () => {
            switch(step) {
              case 0:
                return (
                  <div className="flex flex-col h-full relative animate-in fade-in duration-700 bg-white">
                    <div className="absolute top-8 left-0 w-full px-6 flex justify-center z-20">
                      {settings.logoUrl ? (
                        <img src={settings.logoUrl} alt="Logo" className="h-12 md:h-14 object-contain drop-shadow-xl" />
                      ) : (
                        <div className="bg-black/30 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center justify-center gap-2 shadow-xl border border-white/10">
                          <Smartphone className="w-5 h-5 text-white" />
                          <span className="text-white font-bold tracking-tight">Trevisan Impressoras</span>
                        </div>
                      )}
                    </div>

                    <div className="flex-1 relative overflow-hidden rounded-b-[2rem] shadow-sm">
                      <img src={settings.heroImageUrl} alt="Capa" className="absolute inset-0 w-full h-full object-cover scale-105" />
                      <div className="absolute inset-0 bg-gradient-to-t from-zinc-900 via-zinc-900/40 to-black/40"></div>
                      
                      <div className="absolute bottom-0 left-0 w-full p-6 text-white z-10 pb-12">
                        <h1 className="text-3xl font-semibold tracking-tight mb-3 leading-[1.1] drop-shadow-md">
                          {settings.heroTitle}
                        </h1>
                        <p className="text-zinc-200 text-sm md:text-base leading-relaxed opacity-90 drop-shadow-md max-w-sm">
                          {settings.heroSubtitle}
                        </p>
                      </div>
                    </div>

                    <div className="p-6 bg-white z-10 -mt-6">
                      <button 
                        onClick={() => setStep(1)} 
                        style={primaryStyle}
                        className="w-full font-semibold text-lg py-4 rounded-2xl transition-all flex justify-center items-center gap-2 shadow-[0_8px_25px_rgb(0,0,0,0.15)] hover:scale-[1.02] active:scale-95"
                      >
                        {settings.heroButtonText} <ChevronRight className="w-5 h-5" />
                      </button>
                      <div className="mt-5 text-center">
                        <button onClick={onAdminClick} className="text-[10px] uppercase tracking-widest text-zinc-300 hover:text-zinc-500 font-bold">Acesso Restrito</button>
                      </div>
                    </div>
                  </div>
                );

              case 1:
                return (
                  <div className="flex flex-col h-full animate-in slide-in-from-right-8 duration-300 bg-zinc-50">
                    <div className="p-6 pb-2 bg-white rounded-b-[2rem] shadow-sm relative z-10">
                      <span className="text-xs font-bold tracking-widest uppercase mb-2 block" style={primaryTextStyle}>Passo 1 de 4</span>
                      <h2 className="text-2xl font-semibold text-zinc-900 tracking-tight leading-tight">Selecione o equipamento</h2>
                      <p className="text-sm text-zinc-500 mt-1">Toque na imagem do produto desejado.</p>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-5 space-y-6 pb-24 scrollbar-hide">
                      {products.map((prod) => {
                        const isSelected = formData.produto === prod.name;
                        return (
                          <button 
                            key={prod.id} 
                            onClick={() => handleProductSelect(prod.name)}
                            className={`w-full text-left rounded-[2rem] overflow-hidden transition-all duration-300 relative border-2 ${isSelected ? 'scale-[0.98] shadow-lg' : 'border-transparent bg-white shadow-md hover:shadow-xl'}`}
                            style={isSelected ? { borderColor: settings.primaryColor } : {}}
                          >
                            <div className="h-64 w-full relative bg-white border-b border-zinc-100">
                              {prod.imageUrl ? (
                                <img src={prod.imageUrl} className="w-full h-full object-contain p-5 transition-transform duration-700 hover:scale-105" alt={prod.name} />
                              ) : (
                                <div className="w-full h-full flex items-center justify-center bg-zinc-50 text-zinc-300"><ImageIcon className="w-16 h-16"/></div>
                              )}
                              <div className="absolute inset-0 bg-gradient-to-t from-black/5 to-transparent"></div>
                              
                              {isSelected && (
                                <div className="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center shadow-lg animate-in zoom-in" style={primaryStyle}>
                                  <Check className="w-6 h-6 text-white" />
                                </div>
                              )}
                            </div>
                            
                            <div className={`p-5 ${isSelected ? 'bg-zinc-50' : 'bg-white'}`}>
                              <h3 className={`font-bold text-xl tracking-tight ${isSelected ? 'text-zinc-900' : 'text-zinc-800'}`}>{prod.name}</h3>
                              {prod.desc && <p className="text-sm text-zinc-500 mt-1.5 line-clamp-2 leading-relaxed">{prod.desc}</p>}
                            </div>
                          </button>
                        )
                      })}
                    </div>
                  </div>
                );

              case 2:
                return (
                  <div className="flex flex-col h-full bg-white animate-in slide-in-from-right-8 duration-300">
                    <div className="p-6 pb-4">
                      <span className="text-xs font-bold tracking-widest uppercase mb-2 block" style={primaryTextStyle}>Passo 2 de 4</span>
                      <h2 className="text-2xl font-semibold text-zinc-900 tracking-tight leading-tight">Dados da Empresa</h2>
                      <p className="text-sm text-zinc-500 mt-2 leading-relaxed">Precisamos de alguns dados para preparar a sua cotação.</p>
                    </div>
                    
                    <div className="flex-1 p-6 space-y-5 overflow-y-auto">
                      <div>
                        <label className="block text-sm font-semibold text-zinc-800 mb-2">CNPJ da Empresa</label>
                        <input autoFocus type="text" name="cnpj" value={formData.cnpj} onChange={handleInputChange} className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm text-lg" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="00.000.000/0000-00" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-zinc-800 mb-2">Nome Fantasia (Opcional)</label>
                        <input type="text" name="empresa" value={formData.empresa} onChange={handleInputChange} className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm text-lg" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="A Sua Empresa" />
                      </div>
                      {errorMsg && <p className="text-red-500 text-sm font-medium p-3 bg-red-50 rounded-xl animate-in fade-in">{errorMsg}</p>}
                    </div>
                    
                    <div className="p-6 bg-white border-t border-zinc-50">
                      <button onClick={validateAndNext} style={primaryStyle} className="w-full font-semibold py-4.5 rounded-2xl transition-all shadow-lg active:scale-95 text-lg">Continuar</button>
                    </div>
                  </div>
                );

              case 3:
                return (
                  <div className="flex flex-col h-full bg-white animate-in slide-in-from-right-8 duration-300">
                    <div className="p-6 pb-4">
                      <span className="text-xs font-bold tracking-widest uppercase mb-2 block" style={primaryTextStyle}>Passo 3 de 4</span>
                      <h2 className="text-2xl font-semibold text-zinc-900 tracking-tight leading-tight">Os seus contactos</h2>
                      <p className="text-sm text-zinc-500 mt-2 leading-relaxed">Para onde enviamos a proposta?</p>
                    </div>
                    
                    <div className="flex-1 p-6 space-y-5 overflow-y-auto">
                      <div>
                        <label className="block text-sm font-semibold text-zinc-800 mb-2">O Seu Nome</label>
                        <input autoFocus type="text" name="nome" value={formData.nome} onChange={handleInputChange} className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm text-base" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="Como podemos chamá-lo?" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-zinc-800 mb-2">WhatsApp</label>
                        <input type="tel" name="whatsapp" value={formData.whatsapp} onChange={handleInputChange} className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm text-base" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="(00) 00000-0000" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-zinc-800 mb-2">E-mail Corporativo</label>
                        <input type="email" name="email" value={formData.email} onChange={handleInputChange} className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm text-base" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="email@empresa.com.br" />
                      </div>
                      {errorMsg && <p className="text-red-500 text-sm font-medium p-3 bg-red-50 rounded-xl animate-in fade-in">{errorMsg}</p>}
                    </div>
                    
                    <div className="p-6 bg-white border-t border-zinc-50">
                      <button onClick={validateAndNext} style={primaryStyle} className="w-full font-semibold py-4.5 rounded-2xl transition-all shadow-lg active:scale-95 text-lg">Próximo Passo</button>
                    </div>
                  </div>
                );

              case 4:
                return (
                  <div className="flex flex-col h-full bg-white animate-in slide-in-from-right-8 duration-300">
                    <div className="p-6 pb-4">
                      <span className="text-xs font-bold tracking-widest uppercase mb-2 block" style={primaryTextStyle}>A finalizar</span>
                      <h2 className="text-2xl font-semibold text-zinc-900 tracking-tight leading-tight">Detalhes extras</h2>
                      <p className="text-sm text-zinc-500 mt-2 leading-relaxed">Especifique modelos ou quantidades (opcional).</p>
                    </div>
                    
                    <div className="flex-1 p-6">
                      <textarea name="descricao" value={formData.descricao} onChange={handleInputChange} rows="7" className="w-full px-5 py-4 rounded-2xl bg-zinc-50 border border-zinc-200 focus:bg-white focus:outline-none focus:ring-2 focus:border-transparent transition-all resize-none shadow-sm text-base leading-relaxed" style={{ '--tw-ring-color': settings.primaryColor }} placeholder="Ex: Gostaríamos de orçar 15 notebooks com processador i7 para entrega na próxima semana..."></textarea>
                    </div>
                    
                    <div className="p-6 bg-white border-t border-zinc-50">
                      <button onClick={handleSubmit} disabled={isSubmitting} style={primaryStyle} className="w-full font-semibold text-lg py-4.5 rounded-2xl transition-all shadow-lg active:scale-95 flex justify-center items-center gap-2">
                        {isSubmitting ? <span className="animate-pulse">A finalizar...</span> : 'Concluir e falar no WhatsApp'}
                      </button>
                    </div>
                  </div>
                );

              case 5:
                return (
                  <div className="flex flex-col h-full p-8 items-center justify-center animate-in zoom-in-95 duration-500 text-center bg-white">
                    <div className="w-24 h-24 rounded-full flex items-center justify-center mb-6 shadow-xl bg-green-50 text-green-500 relative">
                      <CheckCircle2 className="w-12 h-12" />
                    </div>
                    <h2 className="text-3xl font-semibold text-zinc-900 tracking-tight mb-3">Tudo certo!</h2>
                    <p className="text-zinc-500 text-lg leading-relaxed max-w-[250px]">A abrir o seu WhatsApp de atendimento...</p>
                  </div>
                );
              
              default: return null;
            }
          };

          return (
            <div className="flex items-center justify-center min-h-screen p-0 md:p-8 relative w-full overflow-hidden">
              <div className="hidden md:block absolute inset-0 z-0 bg-black">
                <img src={settings.heroImageUrl} className="w-full h-full object-cover opacity-30 blur-2xl scale-110 grayscale-[30%]" alt="" />
                <div className="absolute inset-0 bg-gradient-to-b from-black/20 to-black/80"></div>
              </div>

              <div className="w-full h-[100dvh] md:h-[840px] md:max-w-[420px] bg-white md:rounded-[3rem] md:shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col relative overflow-hidden md:border-8 border-zinc-800 z-10 ring-1 ring-black/5">
                
                {step > 0 && step < 5 && (
                  <div className="pt-6 px-5 pb-4 flex items-center justify-between z-30 border-b border-black/5 shadow-sm sticky top-0 transition-colors" style={{ backgroundColor: settings.headerBgColor }}>
                    <button onClick={() => setStep(s => s - 1)} className="w-10 h-10 rounded-full flex items-center justify-center transition-all hover:opacity-80 active:scale-95" style={{ backgroundColor: 'rgba(0,0,0,0.05)', color: settings.headerTextColor }}>
                      <ArrowLeft className="w-5 h-5" />
                    </button>
                    <div className="flex-1 flex justify-center items-center px-4">
                      {settings.logoUrl ? (
                        <img src={settings.logoUrl} alt="Logo" className="max-h-6 max-w-[140px] object-contain" />
                      ) : (
                        <span className="font-bold tracking-tight text-sm" style={{ color: settings.headerTextColor }}>Trevisan Impressoras</span>
                      )}
                    </div>
                    <div className="w-10"></div> 
                  </div>
                )}

                {step > 0 && step < 5 && (
                  <div className="w-full bg-black/5 h-1.5 z-30 relative overflow-hidden">
                    <div className="h-full transition-all duration-700 ease-out rounded-r-full" style={{ width: `${(step / 4) * 100}%`, backgroundColor: settings.primaryColor }}></div>
                  </div>
                )}

                <div className="flex-1 overflow-hidden relative z-20">
                  {renderStepContent()}
                </div>
              </div>
            </div>
          );
        }

        function AdminLogin({ onLogin, onBack, settings }) {
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (password === '123') onLogin();
            else setError('Palavra-passe incorreta.');
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-black relative">
              <div className="bg-zinc-900 p-10 rounded-[2.5rem] shadow-2xl border border-zinc-800 w-full max-w-[400px] relative z-10 animate-in zoom-in-95 duration-500">
                <button onClick={onBack} className="absolute top-6 right-6 text-zinc-500 hover:text-white bg-zinc-800 rounded-full p-2.5 transition-all">
                  <X className="w-5 h-5" />
                </button>
                
                <div className="flex justify-center mb-8">
                  <div className="w-20 h-20 rounded-[1.5rem] flex items-center justify-center shadow-lg" style={{ backgroundColor: settings.primaryColor }}>
                    <ShieldCheck className="w-10 h-10 text-white" />
                  </div>
                </div>
                
                <h2 className="text-2xl font-semibold text-center text-white mb-2 tracking-tight">Painel Gestão</h2>
                <p className="text-center text-zinc-400 text-sm mb-10 font-medium">Acesso restrito à equipa</p>
                
                <form onSubmit={handleSubmit} className="space-y-6">
                  <div>
                    <input 
                      type="password" 
                      value={password} 
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full px-5 py-4 rounded-2xl bg-black border border-zinc-800 focus:outline-none focus:border-zinc-600 text-white transition-all text-center tracking-[0.5em] text-xl font-mono shadow-inner"
                      placeholder="••••••••"
                    />
                    {error && <p className="text-red-400 text-sm mt-3 text-center">{error}</p>}
                  </div>
                  <button type="submit" className="w-full text-white font-medium text-lg py-4 rounded-2xl transition-all shadow-lg hover:opacity-90 active:scale-95" style={{ backgroundColor: settings.primaryColor }}>
                    Aceder
                  </button>
                </form>
              </div>
            </div>
          );
        }

        function AdminDashboard({ leads, settings, products, onLogout }) {
          const [activeTab, setActiveTab] = useState('settings');

          return (
            <div className="min-h-screen bg-zinc-50 flex flex-col md:flex-row font-sans">
              <aside className="w-full md:w-72 bg-white border-r border-zinc-200 flex flex-col z-20 shadow-sm">
                <div className="p-8 border-b border-zinc-100 flex items-center gap-3">
                  <div className="p-2.5 rounded-xl shadow-sm text-white" style={{backgroundColor: settings.primaryColor}}><Settings className="w-5 h-5" /></div>
                  <h2 className="text-xl font-bold tracking-tight text-zinc-900">Workspace</h2>
                </div>
                <nav className="flex-1 p-5 space-y-2">
                  <button onClick={() => setActiveTab('leads')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold text-sm ${activeTab === 'leads' ? 'bg-zinc-900 text-white shadow-md' : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900'}`}>
                    <Users className="w-5 h-5" /> Leads <span className={`ml-auto px-2.5 py-0.5 rounded-full text-xs ${activeTab === 'leads' ? 'bg-white/20' : 'bg-zinc-200'}`}>{leads.length}</span>
                  </button>
                  <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-semibold text-sm ${activeTab === 'settings' ? 'bg-zinc-900 text-white shadow-md' : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900'}`}>
                    <Palette className="w-5 h-5" /> App & Produtos
                  </button>
                </nav>
                <div className="p-5 border-t border-zinc-100">
                  <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 px-4 py-3.5 text-zinc-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all text-sm font-bold">
                    <LogOut className="w-4 h-4" /> Sair
                  </button>
                </div>
              </aside>

              <main className="flex-1 p-6 md:p-10 overflow-y-auto w-full">
                <div className="max-w-5xl mx-auto animate-in fade-in duration-500">
                  {activeTab === 'leads' ? <LeadsManager leads={leads} primaryColor={settings.primaryColor} /> : <SettingsManager settings={settings} products={products} />}
                </div>
              </main>
            </div>
          );
        }

        function LeadsManager({ leads, primaryColor }) {
          const [searchTerm, setSearchTerm] = useState('');
          const [statusFilter, setStatusFilter] = useState('Todos');

          const filteredLeads = leads.filter(lead => {
            const matchesSearch = Object.values(lead).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesStatus = statusFilter === 'Todos' || lead.status === statusFilter;
            return matchesSearch && matchesStatus;
          });

          const [leadToDelete, setLeadToDelete] = useState(null);

          const updateLeadStatus = async (id, newStatus) => { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leads', id), { status: newStatus }); } catch (e) {} };
          
          const updateLeadNotes = async (id, notes) => { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leads', id), { adminNotes: notes }); } catch (e) {} };

          const deleteLead = (id) => { setLeadToDelete(id); };
          
          const confirmDeleteLead = async () => {
            if (!leadToDelete) return;
            try { 
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leads', leadToDelete)); 
            } catch (e) {
              console.error("Erro ao apagar lead:", e);
              alert("Erro ao remover lead. Verifique se tem permissões na base de dados (Firebase Rules).");
            }
            setLeadToDelete(null);
          };

          const exportCSV = () => {
            const headers = ['Data', 'Nome', 'Empresa/CNPJ', 'WhatsApp', 'Email', 'Produto', 'Status', 'Observações Equipa', 'Descrição Cliente'];
            const csvContent = [headers.join(';'), ...filteredLeads.map(l => `${new Date(l.createdAt).toLocaleDateString('pt-BR')};${l.nome};${l.cnpj};${l.whatsapp};${l.email};${l.produto};${l.status};"${(l.adminNotes || '').replace(/"/g, '""')}";"${(l.descricao || '').replace(/"/g, '""')}"`)].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "leads_app.csv";
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          const statusColors = {
            'Novo': 'bg-indigo-100 text-indigo-800',
            'Em atendimento': 'bg-amber-100 text-amber-800',
            'Convertido': 'bg-emerald-100 text-emerald-800',
            'Perdido': 'bg-rose-100 text-rose-800',
            'Arquivado': 'bg-zinc-200 text-zinc-800'
          };

          const cardBgColors = {
            'Novo': 'bg-indigo-50 border-indigo-200 shadow-indigo-100',
            'Em atendimento': 'bg-amber-50 border-amber-200 shadow-amber-100',
            'Convertido': 'bg-emerald-50 border-emerald-200 shadow-emerald-100',
            'Perdido': 'bg-rose-50 border-rose-200 shadow-rose-100',
            'Arquivado': 'bg-zinc-100 border-zinc-200 shadow-zinc-100'
          };

          return (
            <div className="bg-white rounded-[2rem] shadow-sm border border-zinc-200 flex flex-col h-full overflow-hidden relative">
              {leadToDelete && (
                <div className="absolute inset-0 bg-zinc-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 rounded-[2rem]">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-zinc-100">
                    <h3 className="text-xl font-bold text-zinc-900 mb-2">Excluir Lead?</h3>
                    <p className="text-zinc-600 text-sm mb-6">Tem a certeza que deseja excluir este lead? Esta ação não pode ser desfeita.</p>
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setLeadToDelete(null)} className="px-4 py-2.5 rounded-xl text-zinc-600 font-semibold hover:bg-zinc-100 transition-colors text-sm">Cancelar</button>
                      <button onClick={confirmDeleteLead} className="px-4 py-2.5 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition-colors text-sm shadow-md">Sim, Excluir</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="p-8 border-b border-zinc-100 flex flex-col lg:flex-row justify-between gap-5 bg-white">
                <div>
                  <h3 className="text-2xl font-bold text-zinc-900 tracking-tight">Leads Captados</h3>
                  <p className="text-zinc-500 text-sm mt-1">Gira as oportunidades do seu App Funil.</p>
                </div>
                <button onClick={exportCSV} className="flex items-center gap-2.5 text-white px-6 py-3 rounded-xl text-sm font-semibold shadow-md hover:opacity-90 transition-all" style={{ backgroundColor: primaryColor }}>
                  <Download className="w-4 h-4" /> Exportar Planilha
                </button>
              </div>

              <div className="p-5 bg-zinc-50 border-b border-zinc-100 flex flex-col md:flex-row gap-4">
                <div className="relative flex-1">
                  <Search className="w-5 h-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-zinc-400" />
                  <input type="text" placeholder="Pesquisar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3 text-sm rounded-xl border border-zinc-200 focus:ring-2 focus:ring-zinc-900 bg-white" />
                </div>
                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="px-5 py-3 text-sm rounded-xl border border-zinc-200 bg-white font-medium text-zinc-700">
                  <option value="Todos">Todos os Estados</option>
                  <option value="Novo">Novo</option>
                  <option value="Em atendimento">Em atendimento</option>
                  <option value="Convertido">Convertido</option>
                  <option value="Perdido">Perdido</option>
                  <option value="Arquivado">Arquivado</option>
                </select>
              </div>

              <div className="p-6">
                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                  {filteredLeads.map(lead => {
                    const cardBg = cardBgColors[lead.status] || 'bg-white border-zinc-200';
                    return (
                    <div key={lead.id} className={`p-6 border rounded-2xl hover:shadow-lg transition-all flex flex-col ${cardBg}`}>
                      <div className="flex justify-between items-start mb-5 border-b border-black/5 pb-4">
                        <div>
                          <h4 className="font-bold text-lg text-zinc-900">{lead.nome}</h4>
                          <p className="text-xs text-zinc-500 mt-1 font-medium">{new Date(lead.createdAt).toLocaleDateString('pt-BR')} às {new Date(lead.createdAt).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</p>
                        </div>
                        <select value={lead.status} onChange={(e) => updateLeadStatus(lead.id, e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg outline-none cursor-pointer appearance-none shadow-sm ${statusColors[lead.status] || statusColors['Novo']}`}>
                          <option value="Novo">Novo</option>
                          <option value="Em atendimento">Em atendimento</option>
                          <option value="Convertido">Convertido</option>
                          <option value="Perdido">Perdido</option>
                          <option value="Arquivado">Arquivado</option>
                        </select>
                      </div>
                      
                      <div className="space-y-2.5 text-sm flex-1">
                        <div className="flex gap-3 text-zinc-800 font-medium"><Building2 className="w-4 h-4 text-zinc-500"/> {lead.cnpj}</div>
                        <div className="flex gap-3 text-zinc-800"><Phone className="w-4 h-4 text-zinc-500"/> {lead.whatsapp}</div>
                        {lead.email && <div className="flex gap-3 text-zinc-800"><Mail className="w-4 h-4 text-zinc-500"/> {lead.email}</div>}
                        
                        <div className="mt-4 pt-4 border-t border-black/5">
                          <span className="inline-block bg-zinc-900 text-white text-xs px-3 py-1.5 rounded-md mb-2 font-semibold tracking-wide shadow-sm">{lead.produto}</span>
                          {lead.descricao && <p className="text-sm text-zinc-700 bg-white/50 p-3 rounded-xl border border-black/5 italic">"{lead.descricao}"</p>}
                        </div>

                        {/* Botão de Validar Contato Rápido */}
                        {lead.status === 'Novo' && (
                          <div className="mt-4 pt-2">
                            <button onClick={() => updateLeadStatus(lead.id, 'Em atendimento')} className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md transition-all flex justify-center items-center gap-2 hover:scale-[1.02] active:scale-95">
                              <CheckCircle2 className="w-5 h-5" /> Entrei em Contato
                            </button>
                          </div>
                        )}

                        {/* Campo de Observações Históricas */}
                        <div className="mt-4 pt-4 border-t border-black/5">
                          <label className="text-xs font-bold text-zinc-600 uppercase tracking-wider mb-2 flex items-center gap-1"><MessageSquare className="w-3 h-3" /> Observações da Equipa</label>
                          <textarea 
                            defaultValue={lead.adminNotes || ''} 
                            onBlur={(e) => updateLeadNotes(lead.id, e.target.value)}
                            placeholder="Adicione notas da chamada, histórico e próximos passos aqui..."
                            className="w-full p-3 rounded-xl bg-white/60 border border-black/10 focus:bg-white focus:ring-2 focus:ring-zinc-900 text-sm resize-none shadow-inner placeholder-zinc-400"
                            rows="3"
                          ></textarea>
                        </div>
                      </div>

                      <div className="mt-4 pt-4 border-t border-black/5 flex justify-end gap-2">
                        {lead.status !== 'Arquivado' && (
                          <button onClick={() => updateLeadStatus(lead.id, 'Arquivado')} className="text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200/60 px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5 text-xs font-bold">
                            <Archive className="w-4 h-4"/> Arquivar
                          </button>
                        )}
                        <button onClick={() => deleteLead(lead.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition-colors"><Trash2 className="w-4 h-4"/></button>
                      </div>
                    </div>
                  )})}
                  {filteredLeads.length === 0 && <div className="col-span-full py-10 text-center text-zinc-400 text-sm">Nenhum lead encontrado.</div>}
                </div>
              </div>
            </div>
          );
        }

        function SettingsManager({ settings, products }) {
          const [localSettings, setLocalSettings] = useState(settings);
          const [savingMsg, setSavingMsg] = useState('');
          const [showProductForm, setShowProductForm] = useState(false);
          const [productToDelete, setProductToDelete] = useState(null);
          const [editingProductId, setEditingProductId] = useState(null);
          
          const [newProd, setNewProd] = useState({ name: '', desc: '', imageUrl: '' });

          useEffect(() => { setLocalSettings(settings); }, [settings]);

          const handleSettingChange = (e) => setLocalSettings(prev => ({ ...prev, [e.target.name]: e.target.value }));

          const saveSettings = async () => {
            setSavingMsg('A guardar...');
            try {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'general'), localSettings);
              setSavingMsg('Guardado!'); setTimeout(() => setSavingMsg(''), 3000);
            } catch (e) { setSavingMsg('Erro ao guardar.'); }
          };

          const handleFileUpload = (e, targetSetter, fieldName) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 800000) return alert("A imagem deve ter no máximo 800KB para não sobrecarregar a base de dados.");
            const reader = new FileReader();
            reader.onloadend = () => targetSetter(prev => ({ ...prev, [fieldName]: reader.result }));
            reader.readAsDataURL(file);
          };

          const handleSaveProduct = async (e) => {
            e.preventDefault();
            if (newProd.name.trim() === '') return alert("O nome do produto é obrigatório.");
            
            if (editingProductId) {
                // Atualizar produto existente
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', editingProductId), newProd);
            } else {
                // Adicionar novo produto
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), newProd);
            }
            
            setNewProd({ name: '', desc: '', imageUrl: '' });
            setEditingProductId(null);
            setShowProductForm(false);
          };

          const handleEditProduct = (prod) => {
            setNewProd({ name: prod.name, desc: prod.desc || '', imageUrl: prod.imageUrl || '' });
            setEditingProductId(prod.id);
            setShowProductForm(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const handleCancelProductForm = () => {
            setShowProductForm(false);
            setEditingProductId(null);
            setNewProd({ name: '', desc: '', imageUrl: '' });
          };

          const deleteProduct = (id) => { setProductToDelete(id); };

          const confirmDeleteProduct = async () => {
            if (!productToDelete) return;
            try { 
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productToDelete)); 
            } catch (e) {
              console.error("Erro ao apagar produto:", e);
              alert("Erro ao remover produto. Verifique se tem permissões na base de dados (Firebase Rules).");
            }
            setProductToDelete(null);
          };

          return (
            <div className="space-y-8 pb-20 relative">
              
              {productToDelete && (
                <div className="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-zinc-100">
                    <h3 className="text-xl font-bold text-zinc-900 mb-2">Remover Produto?</h3>
                    <p className="text-zinc-600 text-sm mb-6">Tem a certeza que deseja remover este produto da sua lista permanentemente?</p>
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setProductToDelete(null)} className="px-4 py-2.5 rounded-xl text-zinc-600 font-semibold hover:bg-zinc-100 transition-colors text-sm">Cancelar</button>
                      <button onClick={confirmDeleteProduct} className="px-4 py-2.5 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition-colors text-sm shadow-md">Sim, Remover</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-zinc-200">
                <div className="flex justify-between items-center mb-8 border-b border-zinc-100 pb-4">
                  <h3 className="text-xl font-bold text-zinc-900 tracking-tight flex items-center gap-3"><Palette className="w-6 h-6 text-zinc-400"/> Cores e Cabeçalho</h3>
                  {savingMsg && <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg">{savingMsg}</span>}
                </div>
                
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                  <div className="space-y-6">
                    <div>
                      <label className="block text-sm font-bold text-zinc-900 mb-2">Cor dos Botões (Tema Principal)</label>
                      <div className="flex items-center gap-4">
                        <input type="color" name="primaryColor" value={localSettings.primaryColor} onChange={handleSettingChange} className="w-14 h-14 rounded-xl cursor-pointer p-0.5 border border-zinc-200" />
                        <input type="text" name="primaryColor" value={localSettings.primaryColor} onChange={handleSettingChange} className="w-32 px-4 py-2.5 rounded-xl border border-zinc-200 font-mono text-sm uppercase font-bold" />
                      </div>
                    </div>

                    <div className="pt-4 border-t border-zinc-100">
                      <label className="block text-sm font-bold text-zinc-900 mb-2">Cor de Fundo do Topo (App Header)</label>
                      <div className="flex items-center gap-4">
                        <input type="color" name="headerBgColor" value={localSettings.headerBgColor || '#ffffff'} onChange={handleSettingChange} className="w-14 h-14 rounded-xl cursor-pointer p-0.5 border border-zinc-200" />
                        <input type="text" name="headerBgColor" value={localSettings.headerBgColor || '#ffffff'} onChange={handleSettingChange} className="w-32 px-4 py-2.5 rounded-xl border border-zinc-200 font-mono text-sm uppercase font-bold" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-zinc-900 mb-2">Cor do Texto/Ícones do Topo</label>
                      <div className="flex items-center gap-4">
                        <input type="color" name="headerTextColor" value={localSettings.headerTextColor || '#18181b'} onChange={handleSettingChange} className="w-14 h-14 rounded-xl cursor-pointer p-0.5 border border-zinc-200" />
                        <input type="text" name="headerTextColor" value={localSettings.headerTextColor || '#18181b'} onChange={handleSettingChange} className="w-32 px-4 py-2.5 rounded-xl border border-zinc-200 font-mono text-sm uppercase font-bold" />
                      </div>
                    </div>

                  </div>

                  <div className="space-y-6">
                     <div>
                      <label className="block text-sm font-bold text-zinc-900 mb-2">Logomarca (URL ou Upload)</label>
                      <div className="flex gap-2">
                        <input type="text" name="logoUrl" value={localSettings.logoUrl} onChange={handleSettingChange} className="flex-1 px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="https://..." />
                        <label className="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-4 py-3 rounded-xl cursor-pointer font-semibold text-sm transition-colors flex items-center justify-center">
                          <ImageIcon className="w-4 h-4"/>
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileUpload(e, setLocalSettings, 'logoUrl')} />
                        </label>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-zinc-100">
                      <label className="block text-sm font-bold text-zinc-900 mb-2">Imagem de Capa Inicial (Fundo)</label>
                      <div className="flex gap-2">
                        <input type="text" name="heroImageUrl" value={localSettings.heroImageUrl} onChange={handleSettingChange} className="flex-1 px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="https://..." />
                        <label className="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-4 py-3 rounded-xl cursor-pointer font-semibold text-sm transition-colors flex items-center justify-center">
                          <ImageIcon className="w-4 h-4"/>
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileUpload(e, setLocalSettings, 'heroImageUrl')} />
                        </label>
                      </div>
                    </div>
                    
                    <div>
                      <label className="block text-sm font-bold text-zinc-900 mb-2">WhatsApp de Destino (DDI + DDD + Num)</label>
                      <input type="text" name="whatsappNumber" value={localSettings.whatsappNumber} onChange={handleSettingChange} className="w-full px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="5511999999999" />
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-zinc-200">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-zinc-900 tracking-tight flex items-center gap-3"><Smartphone className="w-6 h-6 text-zinc-400"/> Produtos do Funil</h3>
                  <button onClick={() => showProductForm ? handleCancelProductForm() : setShowProductForm(true)} className="flex items-center gap-2 bg-zinc-900 text-white hover:bg-zinc-800 px-5 py-2.5 rounded-xl text-sm font-bold transition-shadow shadow-md">
                    {showProductForm ? <X className="w-4 h-4"/> : <Plus className="w-4 h-4" />} {showProductForm ? 'Cancelar' : 'Adicionar Produto'}
                  </button>
                </div>
                
                {showProductForm && (
                  <form onSubmit={handleSaveProduct} className="bg-zinc-50 p-8 rounded-[2rem] border border-zinc-200 mb-8 animate-in slide-in-from-top-4 shadow-sm relative">
                    {editingProductId && <div className="absolute -top-3 left-8 bg-blue-600 text-white text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full shadow-sm">Modo de Edição</div>}
                    
                    <h4 className="font-bold text-zinc-900 mb-6 text-base tracking-tight">{editingProductId ? 'Editar detalhes do produto' : 'Configurar Novo Produto'}</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                      <div>
                        <label className="block text-xs font-bold text-zinc-700 mb-2 uppercase tracking-wide">Nome do Produto *</label>
                        <input required type="text" value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="Ex: Notebook Core i5" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-700 mb-2 uppercase tracking-wide">Imagem (URL ou Upload)</label>
                        <div className="flex gap-2">
                          <input type="text" value={newProd.imageUrl} onChange={e => setNewProd({...newProd, imageUrl: e.target.value})} className="flex-1 px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="https://..." />
                          <label className="bg-white border border-zinc-200 text-zinc-700 px-4 rounded-xl cursor-pointer font-bold text-xs transition-colors flex items-center justify-center hover:bg-zinc-100 shadow-sm">
                            <ImageIcon className="w-5 h-5"/>
                            <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileUpload(e, setNewProd, 'imageUrl')} />
                          </label>
                        </div>
                      </div>
                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-zinc-700 mb-2 uppercase tracking-wide">Breve Descrição (Opcional)</label>
                        <input type="text" value={newProd.desc} onChange={e => setNewProd({...newProd, desc: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-200 text-sm focus:ring-2 focus:ring-zinc-900" placeholder="Detalhes curtos para ajudar o cliente..." />
                      </div>
                    </div>
                    
                    {newProd.imageUrl && (
                      <div className="mb-8">
                        <p className="text-xs font-bold text-zinc-500 mb-3 uppercase tracking-wide">Previsão da Imagem:</p>
                        <img src={newProd.imageUrl} alt="Preview" className="h-64 w-full md:w-80 object-contain bg-white p-2 rounded-2xl border border-zinc-200 shadow-md" />
                      </div>
                    )}
                    
                    <div className="flex gap-3">
                        <button type="submit" className="bg-zinc-900 hover:bg-black text-white font-bold px-8 py-3.5 rounded-xl text-sm transition-colors shadow-md">
                          {editingProductId ? 'Guardar Alterações' : 'Criar Produto'}
                        </button>
                        {editingProductId && (
                            <button type="button" onClick={handleCancelProductForm} className="bg-white hover:bg-zinc-100 text-zinc-700 border border-zinc-200 font-bold px-8 py-3.5 rounded-xl text-sm transition-colors shadow-sm">
                              Cancelar
                            </button>
                        )}
                    </div>
                  </form>
                )}
                
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                  {products.map(prod => (
                    <div key={prod.id} className="border border-zinc-200 rounded-[2rem] overflow-hidden bg-white hover:shadow-xl transition-all duration-300 group flex flex-col relative">
                      <div className="h-56 w-full bg-white relative overflow-hidden border-b border-zinc-100">
                        {prod.imageUrl ? (
                          <img src={prod.imageUrl} className="w-full h-full object-contain p-4 transition-transform duration-500 group-hover:scale-105" alt={prod.name} />
                        ) : (
                          <div className="w-full h-full flex items-center justify-center bg-zinc-50 text-zinc-300"><ImageIcon className="w-12 h-12"/></div>
                        )}
                        
                        {/* Botões Flutuantes (Editar e Remover) */}
                        <div className="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={() => handleEditProduct(prod)} className="bg-white/90 backdrop-blur-sm text-zinc-700 hover:text-blue-600 hover:bg-white p-2.5 rounded-xl transition-colors shadow-sm">
                                <Edit2 className="w-4 h-4" />
                            </button>
                            <button onClick={() => deleteProduct(prod.id)} className="bg-white/90 backdrop-blur-sm text-zinc-700 hover:text-red-600 hover:bg-red-50 p-2.5 rounded-xl transition-colors shadow-sm">
                                <Trash2 className="w-4 h-4" />
                            </button>
                        </div>
                      </div>
                      <div className="p-6">
                        <h4 className="font-bold text-zinc-900 text-lg mb-1.5">{prod.name}</h4>
                        {prod.desc && <p className="text-sm text-zinc-500 line-clamp-2 leading-relaxed">{prod.desc}</p>}
                      </div>
                    </div>
                  ))}
                  {products.length === 0 && <div className="col-span-full text-center text-zinc-400 py-10 border-2 border-dashed border-zinc-200 rounded-3xl">Nenhum produto cadastrado no momento.</div>}
                </div>
              </div>

              <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50">
                <button onClick={saveSettings} className="bg-zinc-900 text-white font-bold text-lg px-10 py-4 rounded-full shadow-[0_15px_40px_rgba(0,0,0,0.3)] hover:bg-black transition-all hover:scale-105 active:scale-95 flex items-center gap-3 border border-zinc-700">
                  Salvar Modificações Finais
                </button>
              </div>

            </div>
          );
        }

        // Renderiza a Aplicação
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
