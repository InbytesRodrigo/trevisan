[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["frontend/dist/index.html", "backend/catalog-defaults.json", "backend/site-defaults.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/upload/:splat"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/equipamentos/*"
  to = "/.netlify/functions/page?path=/equipamentos/:splat"
  status = 200

[[redirects]]
  from = "/equipamentos"
  to = "/.netlify/functions/page?path=/equipamentos"
  status = 200

[[redirects]]
  from = "/"
  to = "/.netlify/functions/page?path=/"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/page?path=/login"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/page?path=/admin/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/page?path=/admin"
  status = 200

[[redirects]]
  from = "/vendedor"
  to = "/.netlify/functions/page?path=/vendedor"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
